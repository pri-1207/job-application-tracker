# ===================================================================
# Job Application Tracking System - Application Properties
# ===================================================================

spring.application.name=job-application-tracker

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/job_tracker_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================================================
# SpringDoc OpenAPI / Swagger UI
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===================================================================
# Application Info (exposed via Actuator /info)
# ===================================================================
info.app.name=Job Application Tracking System
info.app.description=RESTful API for managing job applications
info.app.version=1.0.0

# ===================================================================
# Logging
# ===================================================================
logging.level.com.jobtracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
